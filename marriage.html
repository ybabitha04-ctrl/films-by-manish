<!DOCTYPE html>

<head>

    <title>Marriage | Films by Manish</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            margin: 0;
            background: black;
            font-family: sans-serif;
        }

        h1 {
            text-align: center;
            color: white;
            padding: 20px 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: auto;
            }
        }
    </style>
</head>
