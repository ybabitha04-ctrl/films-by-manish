<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marriage | Films by Manish</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            margin: 0;
            background: black;
            font-family: sans-serif;
        }

        h1 {
            text-align: center;
            color: white;
            padding: 30px 0;
        }

        /* ===== GALLERY ===== */

        .gallery-container {
            width: 90%;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding-bottom: 40px;
        }

        .gallery-row {
            display: flex;
            gap: 20px;
        }

        .gallery-row.reverse {
            flex-direction: row-reverse;
        }

        .gallery-img.large {
            flex: 2;
        }

        .gallery-img.small {
            flex: 1;
        }

        .gallery-img img {
            width: 100%;
            height: auto;
            object-fit: contain; /* NO CROPPING */
            border-radius: 10px;
        }

        /* ===== MOBILE ===== */

        @media (max-width: 768px) {
            .gallery-row {
                flex-direction: column !important;
            }
        }

    </style>
</head>

<body>

<h1>Marriage Stories</h1>

<section class="gallery">

    <div class="gallery-container">

        <div class="gallery-row">
            <div class="gallery-img large"><img src="/static/images/portfolio/marriage/m1.jpg"></div>
            <div class="gallery-img small"><img src="/static/images/portfolio/marriage/m2.jpg"></div>
        </div>

        <div class="gallery-row reverse">
            <div class="gallery-img large"><img src="/static/images/portfolio/marriage/m3.jpg"></div>
            <div class="gallery-img small"><img src="/static/images/portfolio/marriage/m4.jpg"></div>
        </div>

        <div class="gallery-row">
            <div class="gallery-img large"><img src="/static/images/portfolio/marriage/m5.jpg"></div>
            <div class="gallery-img small"><img src="/static/images/portfolio/marriage/m6.jpg"></div>
        </div>

        <div class="gallery-row reverse">
            <div class="gallery-img large"><img src="/static/images/portfolio/marriage/m7.jpg"></div>
            <div class="gallery-img small"><img src="/static/images/portfolio/marriage/m8.jpg"></div>
        </div>

        <div class="gallery-row">
            <div class="gallery-img large"><img src="/static/images/portfolio/marriage/m9.jpg"></div>
            <div class="gallery-img small"><img src="/static/images/portfolio/marriage/m10.jpg"></div>
        </div>

        <div class="gallery-row reverse">
            <div class="gallery-img large"><img src="/static/images/portfolio/marriage/m11.jpg"></div>
            <div class="gallery-img small"><img src="/static/images/portfolio/marriage/m12.jpg"></div>

        <div class="gallery-row">

        <div class="gallery-row">

        <!-- Last image full width -->

        </div>

    </div>

</section>

</body>
</html>
