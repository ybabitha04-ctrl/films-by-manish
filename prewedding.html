<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Wedding | Films by Manish</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            margin: 0;
            background: black;
            font-family: sans-serif;
        }

        h1 {
            text-align: center;
            color: white;
            padding: 30px 0;
        }

        /* ===== GALLERY ===== */

        .gallery-container {
            width: 90%;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding-bottom: 40px;
        }

        .gallery-row {
            display: flex;
            gap: 20px;
        }

        .gallery-row.reverse {
            flex-direction: row-reverse;
        }

        .gallery-img.large {
            flex: 2;
        }

        .gallery-img.small {
            flex: 1;
        }

        .gallery-img img {
            width: 100%;
            height: auto;
            object-fit: contain; /* NO CROPPING */
            border-radius: 10px;
        }

        /* ===== MOBILE ===== */

        @media (max-width: 768px) {
            .gallery-row {
                flex-direction: column !important;
            }
        }

    </style>
</head>

<body>

<h1>Pre-Wedding Stories</h1>

<section class="gallery">

    <div class="gallery-container">

        <div class="gallery-row">
            <div class="gallery-img large"><img src="/static/images/portfolio/prewedding/p1.jpg"></div>
            <div class="gallery-img small"><img src="/static/images/portfolio/prewedding/p2.jpg"></div>
        </div>

        <div class="gallery-row reverse">
            <div class="gallery-img large"><img src="/static/images/portfolio/prewedding/p3.jpg"></div>
            <div class="gallery-img small"><img src="/static/images/portfolio/prewedding/p4.jpg"></div>
        </div>

        <div class="gallery-row">

            <div class="gallery-img small"><img src="/static/images/portfolio/prewedding/p6.jpg"></div>
        </div>

        <div class="gallery-row reverse">
            <div class="gallery-img large"><img src="/static/images/portfolio/prewedding/p7.jpg"></div>
            <div class="gallery-img small"><img src="/static/images/portfolio/prewedding/p8.jpg"></div>
        </div>

        <div class="gallery-row">
            <div class="gallery-img large"><img src="/static/images/portfolio/prewedding/p9.jpg"></div>
            <div class="gallery-img small"><img src="/static/images/portfolio/prewedding/p10.jpg"></div>
        </div>

        <div class="gallery-row reverse">
            <div class="gallery-img large"><img src="/static/images/portfolio/prewedding/p11.jpg"></div>
            <div class="gallery-img small"><img src="/static/images/portfolio/prewedding/p12.jpg"></div>
        </div>

        <div class="gallery-row">

        </div>

        <div class="gallery-row reverse">

        </div>

        <!-- LAST IMAGE FULL -->
        <div class="gallery-row">
            <div class="gallery-img large"><img src="/static/images/portfolio/prewedding/p17.jpg"></div>
        </div>

    </div>

</section>

</body>
</html>
