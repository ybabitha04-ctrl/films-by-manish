<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebrations | Films by Manish</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            margin: 0;
            background: black;
            font-family: sans-serif;
        }

        h1 {
            text-align: center;
            color: white;
            padding: 20px 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: auto;
            }
        }
    </style>
</head>
